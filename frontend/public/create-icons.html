<!DOCTYPE html>
<html>
<head>
  <title>PWA Icon Generator</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }
    .instructions {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      max-width: 600px;
    }
    canvas {
      margin: 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
    }
    button {
      padding: 10px 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    button:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="instructions">
    <h1>📱 PWA Icon Generator</h1>
    <p><strong>Instructions:</strong></p>
    <ol>
      <li>Click "Download 192x192" button to save icon-192.png</li>
      <li>Click "Download 512x512" button to save icon-512.png</li>
      <li>Save both files in the <code>public</code> folder</li>
    </ol>
  </div>
  
  <canvas id="icon192" width="192" height="192"></canvas>
  <button onclick="downloadIcon('icon192', 'icon-192.png')">Download 192x192</button>
  
  <canvas id="icon512" width="512" height="512"></canvas>
  <button onclick="downloadIcon('icon512', 'icon-512.png')">Download 512x512</button>
  
  <script>
    function createIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Create gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#38bdf8');
      gradient.addColorStop(1, '#6366f1');
      
      // Fill background with rounded corners
      const radius = size * 0.2;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Add letter R with shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = size * 0.05;
      ctx.shadowOffsetX = size * 0.02;
      ctx.shadowOffsetY = size * 0.02;
      ctx.fillStyle = '#0b1221';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('R', size / 2, size / 2);
    }
    
    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }
    
    // Create icons on load
    window.addEventListener('load', () => {
      createIcon('icon192', 192);
      createIcon('icon512', 512);
    });
  </script>
</body>
</html>
